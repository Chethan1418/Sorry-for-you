
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#080808">

<title>I'm Sorry ❤️</title>

<style>

/* =========================
   BASIC SETTINGS
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    background: #050505;
    color: white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    overflow: hidden;
}


/* =========================
   SCREENS
========================= */

.screen {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 25px;

    opacity: 0;

    visibility: hidden;

    transition:
        opacity 1s ease,
        visibility 1s ease;
}

.screen.active {

    opacity: 1;

    visibility: visible;
}


/* =========================
   CONTENT
========================= */

.content {

    width: 100%;

    max-width: 430px;

    animation: appear 1.2s ease;
}

@keyframes appear {

    from {

        opacity: 0;

        transform:
            translateY(25px)
            scale(0.97);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================
   HEART
========================= */

.big-heart {

    font-size: 75px;

    margin-bottom: 25px;

    animation:
        heartbeat 1.3s infinite;
}

@keyframes heartbeat {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.18);
    }

    100% {
        transform: scale(1);
    }
}


/* =========================
   TEXT
========================= */

h1 {

    font-size: 38px;

    line-height: 1.2;

    margin-bottom: 18px;
}

h2 {

    font-size: 28px;

    margin-bottom: 18px;
}

p {

    font-size: 18px;

    line-height: 1.7;

    color: #dddddd;
}


/* =========================
   BUTTON
========================= */

.button {

    display: inline-block;

    margin-top: 30px;

    padding: 15px 30px;

    border: none;

    border-radius: 50px;

    background:
        linear-gradient(
            135deg,
            #ff477e,
            #ff6b9a
        );

    color: white;

    font-size: 17px;

    font-weight: 600;

    box-shadow:
        0 10px 35px
        rgba(255, 71, 126, 0.35);

    cursor: pointer;

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}

.button:active {

    transform: scale(0.94);

    box-shadow:
        0 5px 15px
        rgba(255, 71, 126, 0.25);
}


/* =========================
   TYPING TEXT
========================= */

.typing {

    min-height: 60px;

    font-size: 19px;

    color: #eeeeee;

    line-height: 1.7;
}


/* =========================
   VIDEO
========================= */

.video-container {

    width: 100%;

    max-width: 430px;
}

video {

    display: block;

    width: 100%;

    max-height: 70vh;

    border-radius: 20px;

    background: black;

    box-shadow:
        0 0 35px
        rgba(255, 255, 255, 0.12);
}

.video-note {

    margin-top: 15px;

    color: #bbbbbb;

    font-size: 14px;
}


/* =========================
   FINAL MESSAGE
========================= */

.final-message {

    font-size: 22px;

    line-height: 1.7;

    color: #ff9ab8;

    margin-top: 20px;
}


/* =========================
   FLOATING HEARTS
========================= */

.floating-heart {

    position: fixed;

    bottom: -40px;

    pointer-events: none;

    z-index: 100;

    animation:
        floatHeart linear forwards;
}

@keyframes floatHeart {

    0% {

        transform:
            translateY(0)
            rotate(0deg);

        opacity: 0;
    }

    10% {

        opacity: 1;
    }

    100% {

        transform:
            translateY(-110vh)
            rotate(25deg);

        opacity: 0;
    }
}


/* =========================
   SMALL SCREEN
========================= */

@media (max-width: 380px) {

    h1 {
        font-size: 32px;
    }

    h2 {
        font-size: 25px;
    }

    p {
        font-size: 16px;
    }

    .big-heart {
        font-size: 65px;
    }
}

</style>

</head>


<body>


<!-- ==================================
     SCREEN 1
================================== -->

<section
    id="screen1"
    class="screen active">

    <div class="content">

        <div class="big-heart">
            ❤️
        </div>

        <h1>
            Hey Princess...
        </h1>

        <p>
            I made something for you
        </p>

        <button
            class="button"
            onclick="showScreen(2)">

            Tap here ❤️

        </button>

    </div>

</section>



<!-- ==================================
     SCREEN 2
================================== -->

<section
    id="screen2"
    class="screen">

    <div class="content">

        <div class="big-heart">
            🥺
        </div>

        <h2>
            I need to tell you something
        </h2>

        <div
            id="typingText"
            class="typing">
        </div>

        <button
            id="sorryButton"
            class="button"
            style="display:none;"
            onclick="showScreen(3)">

            I'm really sorry ❤️

        </button>

    </div>

</section>



<!-- ==================================
     SCREEN 3
================================== -->

<section
    id="screen3"
    class="screen">

    <div class="content">

        <div class="big-heart">
            💗
        </div>

        <h2>
            Before you watch this...
        </h2>

        <p>

            I don't expect everything
            to become okay instantly

            <br><br>

            I just wanted you to know
            that I genuinely mean it

        </p>

        <button
            class="button"
            onclick="startVideo()">

            Watch my message 🎬

        </button>

    </div>

</section>



<!-- ==================================
     SCREEN 4
================================== -->

<section
    id="screen4"
    class="screen">

    <div class="content">

        <div class="video-container">

            <video
                id="sorryVideo"
                controls
                playsinline
                preload="metadata">

                <source
                    src="sorry.mp4"
                    type="video/mp4">

                Your browser does not support
                video playback.

            </video>

            <p class="video-note">

                ❤️ This is for you

            </p>

            <div class="final-message">

                I really am sorry ❤️
                <br>
                I love you

            </div>

        </div>

    </div>

</section>



<script>

/* ==================================
   SCREEN CONTROL
================================== */

function showScreen(number) {

    const screens =
        document.querySelectorAll(".screen");

    screens.forEach(function(screen) {

        screen.classList.remove("active");

    });

    const selected =
        document.getElementById(
            "screen" + number
        );

    selected.classList.add("active");

    if (number === 2) {

        startTyping();

    }

}


/* ==================================
   TYPING ANIMATION
================================== */

const message =
    "I know I made a mistake and I know saying sorry cannot magically fix everything... but I really want you to know that I am genuinely sorry. I never wanted to hurt you.";

let typingStarted = false;


function startTyping() {

    if (typingStarted) {
        return;
    }

    typingStarted = true;

    const textElement =
        document.getElementById(
            "typingText"
        );

    const button =
        document.getElementById(
            "sorryButton"
        );

    let index = 0;


    function typeCharacter() {

        if (index < message.length) {

            textElement.textContent +=
                message.charAt(index);

            index++;

            setTimeout(
                typeCharacter,
                35
            );

        } else {

            button.style.display =
                "inline-block";
        }

    }


    typeCharacter();

}


/* ==================================
   VIDEO
================================== */

function startVideo() {

    showScreen(4);

    const video =
        document.getElementById(
            "sorryVideo"
        );

    /*
       Browsers normally allow playback
       after the user has tapped a button.
    */

    video.play().catch(function() {

        /*
           If autoplay is blocked,
           the normal video controls remain
           available.
        */

    });

}


/* ==================================
   FLOATING HEARTS
================================== */

function createHeart() {

    const heart =
        document.createElement("div");

    heart.className =
        "floating-heart";

    const hearts = [
        "❤️",
        "💕",
        "💗",
        "💖",
        "💓"
    ];

    heart.textContent =
        hearts[
            Math.floor(
                Math.random() *
                hearts.length
            )
        ];

    heart.style.left =
        Math.random() * 100 + "vw";

    heart.style.fontSize =
        (16 + Math.random() * 20)
        + "px";

    heart.style.animationDuration =
        (4 + Math.random() * 4)
        + "s";

    document.body.appendChild(
        heart
    );


    setTimeout(function() {

        heart.remove();

    }, 8000);

}


/* Create hearts regularly */

setInterval(
    createHeart,
    700
);

</script>


</body>

</html>
